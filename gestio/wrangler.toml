name = "parpallo-gestio-local"
main = "worker.js"
compatibility_date = "2026-09-01"
workers_dev = false

[vars]
APP_ENV = "development"
DEV_IDENTITY_PROVIDER = "enabled"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

[[d1_databases]]
binding = "DB"
database_name = "parpallo-gestio-local"
database_id = "00000000-0000-0000-0000-000000000001"
migrations_dir = "./migrations"

[[r2_buckets]]
binding = "EVIDENCE_STORAGE"
bucket_name = "parpallo-evidence-local"
jurisdiction = "eu"

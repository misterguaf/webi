# Grup Scout Parpalló — configuració de Netlify.
# El lloc és estàtic (arrel del repositori) i la funció d'alta viu a
# netlify/functions/. La redirecció deixa l'endpoint com a /api/alta,
# la mateixa ruta que a Vercel i a Cloudflare, perquè fersescout.html no
# haja de canviar si algun dia es canvia de hosting.

[build]
  publish = "."
  functions = "netlify/functions"

[[redirects]]
  from = "/api/alta"
  to = "/.netlify/functions/alta"
  status = 200
  force = true

[[headers]]
  for = "/api/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Cache-Control = "no-store"

name = "parpallo-inscripcions"
main = "worker.js"
compatibility_date = "2026-09-19"

[vars]
PORTAL_ALLOWED_ORIGIN = "https://inscripcions.grupscoutparpallo.com"
PORTAL_SESSION_VERSION = "2026-2027"
APP_ENV = "production"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
html_handling = "none"

# Audit A1: the portal has no D1/R2 binding. Gestió data is reachable only through the
# narrow PortalIntake entrypoint. The production Gestió Worker does not exist yet (deploy
# is blocked), so this binding fails closed until it is provisioned and reviewed.
[[services]]
binding = "GESTIO_INTAKE"
service = "parpallo-gestio"
entrypoint = "PortalIntake"

[[ratelimits]]
name = "PORTAL_LOGIN_LIMITER"
namespace_id = "270901"

  [ratelimits.simple]
  limit = 5
  period = 60

# Secrets obligatoris, configurats amb `wrangler secret put`:
# PORTAL_ACCESS_PASSWORD
# PORTAL_SESSION_SECRET
# El portal 3B no necessita SHEETS_WEBHOOK_URL ni SHEETS_SHARED_SECRET;
# els noms legacy queden documentats al backend públic fins retirar-ne dependències.

# Local synthetic environment. The portal reaches the local Gestió Worker
# (parpallo-gestio-local, started by `npm run dev:gestio`) through the same
# PortalIntake service binding; it has no local D1/R2 binding either.
[env.local]
name = "parpallo-inscripcions-local"

[env.local.vars]
PORTAL_ALLOWED_ORIGIN = "http://127.0.0.1:4100"
PORTAL_SESSION_VERSION = "demo-2026-2027"
PORTAL_DEV_ALLOW_HTTP = "1"
PORTAL_ACCESS_PASSWORD = "families-demo"
PORTAL_SESSION_SECRET = "secret-local-fictici-de-mes-de-trenta-dos-caracters"
APP_ENV = "development"

[env.local.assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
html_handling = "none"

[[env.local.services]]
binding = "GESTIO_INTAKE"
service = "parpallo-gestio-local"
entrypoint = "PortalIntake"

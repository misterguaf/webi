<!doctype html>
<html lang="ca-ES-valencia" data-lang="va">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>Accés privat · Grup Scout Parpalló</title>
  <link rel="stylesheet" href="/portal.css?v=1">
</head>
<body>
  <main class="login-shell" id="main">
    <section class="login-card" aria-labelledby="login-title">
      <img class="login-mark" src="/cierva-parpallo.png" alt="">
      <p class="eyebrow"><span class="va">Espai privat de famílies</span><span class="es">Espacio privado de familias</span></p>
      <h1 id="login-title"><span class="va">Inscripcions</span><span class="es">Inscripciones</span></h1>
      <p class="lede"><span class="va">Escriu la contrasenya que vos ha facilitat el grup.</span><span class="es">Escribe la contraseña que os ha facilitado el grupo.</span></p>

      <form id="login-form" novalidate>
        <p id="login-alert" class="alert error" role="alert" tabindex="-1" hidden></p>
        <div class="field">
          <label for="password"><span class="va">Contrasenya</span><span class="es">Contraseña</span></label>
          <input id="password" name="password" type="password" autocomplete="current-password" required>
        </div>
        <div class="login-actions">
          <button class="btn btn-primary" id="login-submit" type="submit"><span class="va">Entrar</span><span class="es">Entrar</span></button>
          <button class="toggle-pass" id="toggle-password" type="button" aria-pressed="false"><span class="va">Mostrar</span><span class="es">Mostrar</span></button>
        </div>
      </form>

      <div class="login-meta">
        <button class="lang" id="lang-toggle" type="button" aria-label="Canvia a castellà"><span class="lbl">cas</span></button>
        <small><span class="va">L'accés dura 24 hores en este dispositiu.</span><span class="es">El acceso dura 24 horas en este dispositivo.</span></small>
      </div>
    </section>
  </main>
  <script src="/access.js?v=1" defer></script>
</body>
</html>
